name: Deploy paper showcase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper-showcase/**'
      - '.github/workflows/deploy-paper-showcase.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paper-showcase-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: paper-showcase/.node-version
          cache: npm
          cache-dependency-path: paper-showcase/package-lock.json

      - name: Install showcase dependencies
        working-directory: paper-showcase
        run: npm ci

      - name: Build static showcase
        working-directory: paper-showcase
        env:
          SHOWCASE_URL: ${{ steps.pages.outputs.origin }}
          SHOWCASE_ROOT: ${{ steps.pages.outputs.base_path }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: paper-showcase/public

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
